{% extends 'base.html' %}{% block content %}<div class="panel narrow"><h1>{{'Create driver account' if mode=='register' else 'Welcome back'}}</h1><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}">{% if mode=='register' %}<label>Full name<input name="name" required></label>{% endif %}<label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button>{{'Register' if mode=='register' else 'Login'}}</button></form>{% if mode=='login' %}{% endif %}</div>{% endblock %}
