{% extends 'base.html' %}{% block content %}<h1>My Vehicles</h1><div class="cols"><section class="panel"><h2>Add a vehicle</h2><form method="post"><label>Plate number<input name="plate" required></label><label>Connector type<select name="connector"><option>CCS2</option><option>Type 2</option><option>CHAdeMO</option></select></label><label>Battery capacity (kWh)<input name="capacity" type="number" step="0.1" min="1" required></label><button>Save Vehicle</button></form></section><section class="panel"><h2>Saved Vehicles</h2>{% for v in vehicles %}<p class="item">🚗 {{v.plate}} • {{v.connector}} • {{v.capacity}} kWh</p>{% else %}<p>No vehicles saved yet.</p>{% endfor %}</section></div>{% endblock %}
